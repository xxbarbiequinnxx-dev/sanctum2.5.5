name: Install Android native source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/install-android-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore native Android project
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/native.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/native.b64 > /tmp/native.zip
          rm -rf native/android
          unzip -q /tmp/native.zip
          test -f native/android/app/src/main/java/com/sanctum/chamber/MainActivity.java
          grep -q 'googleSignIn' native/android/app/src/main/java/com/sanctum/chamber/MainActivity.java
          grep -q 'versionCode 28' native/android/app/build.gradle
      - name: Commit native Android source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/android
          git commit -m "Add Android 2.5.5 native Google sign-in source"
          git push origin HEAD:main
