PATHS

          while IFS= read -r file; do
            test -f "$APP_ROOT/$file" || { echo "Missing expected file: $file"; exit 1; }
            mkdir -p "/tmp/sanctum-selected/$(dirname "$file")"
            cp -p "$APP_ROOT/$file" "/tmp/sanctum-selected/$file"
          done < /tmp/sanctum-paths.txt

      - name: Verify exact archive digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path("/tmp/sanctum-selected")
          files=sorted(p for p in root.rglob("*") if p.is_file())
          h=hashlib.sha256()
          total=0
          for p in files:
              rel=p.relative_to(root).as_posix()
              data=p.read_bytes()
              total += len(data)
              digest=hashlib.sha256(data).hexdigest()
              h.update(rel.encode()+b"\0"+str(len(data)).encode()+b"\0"+digest.encode()+b"\n")

          print("files",len(files))
          print("bytes",total)
          print("tree_digest",h.hexdigest())
          assert len(files)==256
          assert total==4342207
          assert h.hexdigest()=="8cb493d4b2e87d19e81d3e6fe969b6c6f630850e09719a9786db23a5a12b1031"
          PY

      - name: Populate repository
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/sanctum-selected/. .

          # Environment values remain in Vercel, not this public GitHub repo.
          rm -f .env .env.local .env.production .env.development .env.preview
          find . -type f \( -name '*.keystore' -o -name '*.jks' \) -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Populate Sanctum 2.5.5 from verified All-Sanctum-Files source"
          git push origin HEAD:main
